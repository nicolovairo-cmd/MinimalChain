name: Build Minimal Chain VST3

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          path: JUCE
          fetch-depth: 1

      - name: Configure
        shell: pwsh
        run: |
          cmake -B build -S . -DJUCE_DIR="$env:GITHUB_WORKSPACE/JUCE"

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Package VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item -Recurse "build\MinimalChainVST3_artefacts\Release\VST3\Minimal Chain.vst3" "artifact\"
